sar: true

adapt:
  pretrained_path: saved_models/lama_no_sar_finetuned.pth
  save_name: lama_sar_pretrained.pth

train:
  model_path: saved_models/lama_sar_pretrained.pth
  save_path:  saved_models/lama_sar_finetuned.pth
  batch_size: 4
  num_workers: 2
  epochs_frozen: 1
  epochs_full:   1
  lr_frozen: 1e-3
  lr_full:   1e-4

eval:
  model_path: saved_models/lama_sar_finetuned.pth
  batch_size: 4
  num_workers: 2